# GopherAI Nginx 生产配置
# 将此文件放到服务器的 /etc/nginx/sites-available/gopherai
# 然后执行: sudo ln -s /etc/nginx/sites-available/gopherai /etc/nginx/sites-enabled/
# 再执行: sudo nginx -t && sudo systemctl reload nginx

server {
    # HTTP → HTTPS 重定向（配置 SSL 后启用）
    listen 80;
    server_name your-domain.com;  # TODO: 替换为你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # TODO: 替换为你的域名

    # SSL 证书（后面用 Certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态文件（Vue 打包后的 dist 目录）
    root /var/www/gopherai/dist;
    index index.html;

    # Gzip 压缩，提升页面加载速度
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ========== API 反向代理 ==========
    # 所有 /api/ 开头的请求转发给 Go 后端
    # 前端 axios 配的 baseURL 是 /api，所以这里把 /api → /api/v1
    location /api/ {
        proxy_pass http://127.0.0.1:9090/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 支持 — 不缓冲流式输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ========== 健康检查 ==========
    location /healthz {
        proxy_pass http://127.0.0.1:9090/api/v1/healthz;
        proxy_set_header Host $host;
        access_log off;  # 健康检查不记日志，减少磁盘 I/O
    }

    # ========== 前端页面 ==========
    # 所有非 API 请求返回 Vue 的 index.html（前端路由需要）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
