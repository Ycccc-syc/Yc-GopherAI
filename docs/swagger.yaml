basePath: /api/v1
definitions:
  code.Code:
    enum:
    - 1000
    - 2001
    - 2002
    - 2003
    - 2004
    - 2005
    - 2006
    - 2007
    - 2008
    - 2009
    - 2010
    - 3001
    - 4001
    - 5001
    - 5002
    - 5003
    format: int64
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParams
    - CodeUserExist
    - CodeUserNotExist
    - CodeInvalidPassword
    - CodeNotMatchPassword
    - CodeInvalidToken
    - CodeNotLogin
    - CodeInvalidCaptcha
    - CodeRecordNotFound
    - CodeIllegalPassword
    - CodeForbidden
    - CodeServerBusy
    - AIModelNotFind
    - AIModelCannotOpen
    - AIModelFail
  model.SessionInfo:
    properties:
      name:
        type: string
      sessionId:
        type: string
    type: object
  session.CreateSessionAndSendMessageRequest:
    properties:
      modelType:
        description: 模型类型;
        type: string
      question:
        description: 用户问题;
        type: string
    required:
    - modelType
    - question
    type: object
  session.CreateSessionAndSendMessageResponse:
    properties:
      Information:
        description: AI回答
        type: string
      sessionId:
        description: 当前会话ID
        type: string
      status_code:
        $ref: '#/definitions/code.Code'
      status_msg:
        type: string
    type: object
  session.GetUserSessionsResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/model.SessionInfo'
        type: array
      status_code:
        $ref: '#/definitions/code.Code'
      status_msg:
        type: string
    type: object
  user.CaptchaRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.CaptchaResponse:
    properties:
      status_code:
        $ref: '#/definitions/code.Code'
      status_msg:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      captcha:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - email
    type: object
  user.RegisterResponse:
    properties:
      status_code:
        $ref: '#/definitions/code.Code'
      status_msg:
        type: string
      token:
        type: string
    type: object
host: localhost:9090
info:
  contact: {}
  description: AI 聊天助手后端 API
  title: GopherAI API
  version: "1.0"
paths:
  /AI/chat/send-new-session:
    post:
      consumes:
      - application/json
      description: 创建新会话并发送用户消息，返回 AI 完整回答
      parameters:
      - description: 用户问题和模型类型
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.CreateSessionAndSendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.CreateSessionAndSendMessageResponse'
      summary: 创建会话并发送消息
      tags:
      - AI 聊天
  /AI/chat/sessions:
    get:
      description: 获取当前用户的所有历史会话列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.GetUserSessionsResponse'
      summary: 获取会话列表
      tags:
      - AI 聊天
  /user/captcha:
    post:
      consumes:
      - application/json
      description: 向指定邮箱发送验证码，用于注册流程
      parameters:
      - description: 邮箱地址
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CaptchaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.CaptchaResponse'
      summary: 发送邮箱验证码
      tags:
      - 用户
  /user/register:
    post:
      consumes:
      - application/json
      description: 通过邮箱、验证码和密码注册账号，注册成功自动返回 JWT Token
      parameters:
      - description: 注册参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.RegisterResponse'
      summary: 用户注册
      tags:
      - 用户
schemes:
- http
swagger: "2.0"
